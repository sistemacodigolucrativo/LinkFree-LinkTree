name: LinkFree PHP syntax lint
on:
  push:
    paths:
      - 'linkstack/app/Services/GithubThemes.php'
      - 'linkstack/app/Http/Controllers/GithubThemesController.php'
      - 'linkstack/app/Http/Controllers/ThemePreviewController.php'
      - 'linkstack/app/Http/Controllers/AdminController.php'
      - 'linkstack/app/Http/Controllers/UserController.php'
      - 'linkstack/routes/web.php'
      - 'linkstack/app/Http/Controllers/AbuseReportController.php'
      - 'linkstack/app/Http/Controllers/VerificationController.php'
      - 'linkstack/app/Http/Controllers/ReferralController.php'
      - 'linkstack/app/Services/ReferralService.php'
      - 'linkstack/app/Models/User.php'
      - 'linkstack/database/migrations/2026_11_23_000002_create_referral_tables.php'
      - 'linkstack/database/migrations/2026_11_23_000003_create_profile_verification_workflow.php'
      - 'linkstack/database/migrations/2026_11_23_000004_create_abuse_reports_tables.php'
      - '.github/workflows/theme-manager-lint.yml'
  pull_request:
    paths:
      - 'linkstack/app/Services/GithubThemes.php'
      - 'linkstack/app/Http/Controllers/GithubThemesController.php'
      - 'linkstack/app/Http/Controllers/ThemePreviewController.php'
      - 'linkstack/app/Http/Controllers/AdminController.php'
      - 'linkstack/app/Http/Controllers/UserController.php'
      - 'linkstack/routes/web.php'
      - 'linkstack/app/Http/Controllers/AbuseReportController.php'
      - 'linkstack/app/Http/Controllers/VerificationController.php'
      - 'linkstack/app/Http/Controllers/ReferralController.php'
      - 'linkstack/app/Services/ReferralService.php'
      - 'linkstack/app/Models/User.php'
      - 'linkstack/database/migrations/2026_11_23_000002_create_referral_tables.php'
      - 'linkstack/database/migrations/2026_11_23_000003_create_profile_verification_workflow.php'
      - 'linkstack/database/migrations/2026_11_23_000004_create_abuse_reports_tables.php'
jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check PHP syntax
        run: |
          set -e
          php -l linkstack/app/Services/GithubThemes.php
          php -l linkstack/app/Services/ThemeInstaller.php
          php -l linkstack/app/Http/Controllers/GithubThemesController.php
          php -l linkstack/app/Http/Controllers/ThemePreviewController.php
          php -l linkstack/app/Http/Controllers/AdminController.php
          php -l linkstack/app/Http/Controllers/UserController.php
          php -l linkstack/routes/web.php
          php -l linkstack/app/Http/Controllers/ReferralController.php
          php -l linkstack/app/Services/ReferralService.php
          php -l linkstack/app/Http/Controllers/VerificationController.php
          php -l linkstack/app/Http/Controllers/AbuseReportController.php
          php -l linkstack/app/Models/User.php
          php -l linkstack/database/migrations/2026_11_23_000002_create_referral_tables.php
          php -l linkstack/database/migrations/2026_11_23_000003_create_profile_verification_workflow.php
          php -l linkstack/database/migrations/2026_11_23_000004_create_abuse_reports_tables.php
