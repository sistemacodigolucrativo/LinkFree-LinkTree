name: Isolated HTTP and browser a11y acceptance (no production)
on:
  push:
    branches: [fix/homologacao-get-delete-a11y-20261124]
    paths:
      - 'scripts/qa-isolated/**'
      - '.github/workflows/qa-functional-isolated.yml'
      - 'linkstack/routes/**'
      - 'linkstack/app/Http/Controllers/**'
      - 'linkstack/resources/views/**'
      - 'linkstack/assets/js/main-dashboard.js'
      - 'linkstack/assets/js/public-contrast.js'
      - 'linkstack/assets/js/plugins/setting.js'
      - 'linkstack/assets/css/**'
      - 'linkstack/assets/linkstack/css/**'
      - 'linkstack/themes/**'
      - 'linkstack/app/Services/ThemeOptions.php'
      - 'linkstack/app/Services/PublicSiteContent.php'
      - 'linkstack/app/Services/MemberFeatureCatalog.php'
      - 'scripts/audit-public-member-catalog.py'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/qa-isolated/**'
      - '.github/workflows/qa-functional-isolated.yml'
      - 'linkstack/routes/**'
      - 'linkstack/app/Http/Controllers/**'
      - 'linkstack/resources/views/**'
      - 'linkstack/assets/js/main-dashboard.js'
      - 'linkstack/assets/js/public-contrast.js'
      - 'linkstack/assets/js/plugins/setting.js'
      - 'linkstack/assets/css/**'
      - 'linkstack/assets/linkstack/css/**'
      - 'linkstack/themes/**'
      - 'linkstack/app/Services/ThemeOptions.php'
      - 'linkstack/app/Services/PublicSiteContent.php'
      - 'linkstack/app/Services/MemberFeatureCatalog.php'
      - 'scripts/audit-public-member-catalog.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  http-behavior:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check HTTP acceptance Python syntax first
        run: python3 -m py_compile scripts/qa-isolated/http_acceptance.py scripts/qa-isolated/reviews_acceptance.py
      - name: Install PHP SQLite driver if absent
        run: |
          if ! php -m | grep -qi '^pdo_sqlite$'; then
            sudo apt-get update -qq
            sudo apt-get install -y php-sqlite3
          fi
      - name: Prepare strictly isolated synthetic application
        shell: bash
        run: |
          set -euo pipefail
          export QA_APP_ROOT=/tmp/linkfree-audit/linkstack
          install -d /tmp/linkfree-audit "$QA_APP_ROOT"
          rsync -a --exclude='.env' --exclude='*.sqlite' --exclude='*.sqlite3' --exclude='*.db' --exclude=INSTALLING --exclude=INSTALLERLOCK linkstack/ "$QA_APP_ROOT/"
          install -d "$QA_APP_ROOT"/database "$QA_APP_ROOT"/storage/framework/{cache,sessions,views} "$QA_APP_ROOT"/storage/logs "$QA_APP_ROOT"/assets/favicon/icons
          touch "$QA_APP_ROOT/database/audit.sqlite"
          KEY=$(php -r 'echo "base64:".base64_encode(random_bytes(32));')
          cat > "$QA_APP_ROOT/.env" <<EOF
          APP_NAME=LinkFreeQA
          APP_ENV=local
          APP_DEBUG=false
          APP_KEY=$KEY
          APP_URL=http://127.0.0.1:18765
          DB_CONNECTION=sqlite
          DB_DATABASE=/tmp/linkfree-audit/linkstack/database/audit.sqlite
          DB_FOREIGN_KEYS=true
          SESSION_DRIVER=file
          CACHE_DRIVER=array
          QUEUE_CONNECTION=sync
          LOG_CHANNEL=stderr
          MAIL_MAILER=log
          MAIL_FROM_ADDRESS=qa@example.test
          ALLOW_REGISTRATION=true
          REGISTER_AUTH=auth
          FORCE_ROUTE_HTTPS=false
          EOF
          test "$(grep -c 'APP_ENV=local' "$QA_APP_ROOT/.env")" = 1
          cd "$QA_APP_ROOT"
          php artisan migrate --force --no-interaction > /tmp/linkfree-audit/migrations.log
          QA_APP_ROOT="$QA_APP_ROOT" php "$GITHUB_WORKSPACE/scripts/qa-isolated/seed.php"
      - name: Start localhost-only Laravel server
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/linkfree-audit/linkstack
          # Same router as browser QA; no Laravel .env restart watcher.
          php -S 127.0.0.1:18765 server.php > /tmp/linkfree-audit/server.log 2>&1 &
          echo $! > /tmp/linkfree-audit/server.pid
          for i in $(seq 1 45); do
            if curl --silent --output /dev/null --max-time 2 http://127.0.0.1:18765/login; then
              echo "Local isolated app ready"
              exit 0
            fi
            sleep 1
          done
          echo "Local server did not start"
          tail -n 30 /tmp/linkfree-audit/server.log
          exit 1
      - name: Verify reviews, consent and dynamic branding in isolated HTTP/SQLite
        env:
          QA_EXPECTED_SITE: http://127.0.0.1:18765
        run: |
          python3 scripts/qa-isolated/reviews_acceptance.py
          php scripts/qa-isolated/reviews_brand_dynamic.php
      - name: Verify real HTTP GET/DELETE/POST and CSRF
        env:
          QA_EXPECTED_SITE: http://127.0.0.1:18765
          QA_OUTPUT: /tmp/linkfree-audit/http-results.json
        run: python3 scripts/qa-isolated/http_acceptance.py
      - name: Verify registration with duplicate values and unavailable SMTP
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/linkfree-audit/linkstack
          REGISTER_AUTH=verified MANUAL_USER_VERIFICATION=false LOCALE=pt-BR MAIL_MAILER=smtp MAIL_HOST=127.0.0.1 MAIL_PORT=1 MAIL_ENCRYPTION=tls php -S 127.0.0.1:18766 server.php > /tmp/linkfree-audit/registration-server.log 2>&1 &
          registration_pid=$!
          trap 'kill "$registration_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl --silent --output /dev/null --max-time 2 http://127.0.0.1:18766/register; then break; fi
            if [ "$i" -eq 30 ]; then echo 'Registration fixture failed to start'; exit 1; fi
            sleep 1
          done
          cd "$GITHUB_WORKSPACE"
          QA_EXPECTED_REGISTRATION_SITE=http://127.0.0.1:18766 python3 scripts/qa-isolated/registration_acceptance.py
      - name: Verify isolated HTTP server remained alive
        if: always()
        run: |
          test -s /tmp/linkfree-audit/server.pid
          kill -0 "$(cat /tmp/linkfree-audit/server.pid)"
          curl --fail --silent --show-error --max-time 10 http://127.0.0.1:18765/login >/dev/null
      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linkfree-qa-http-synthetic
          path: /tmp/linkfree-audit/http-results.json
          if-no-files-found: warn
          retention-days: 30

  config-browser-smoke:
    # Narrow browser acceptance for PR #34; expensive full-site axe remains manual.
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate browser test and fixture script syntax
        run: |
          node --check scripts/qa-isolated/config_browser_smoke.cjs
          bash -n scripts/qa-isolated/run_config_browser_smoke.sh
      - name: Chromium settings acceptance in synthetic fixture
        timeout-minutes: 10
        run: bash scripts/qa-isolated/run_config_browser_smoke.sh
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linkfree-qa-config-browser-synthetic
          path: |
            /tmp/linkfree-audit/config-browser-results.json
            /tmp/linkfree-audit/config-screenshots/
          if-no-files-found: warn
          retention-days: 30

  member-navigation-browser:
    # Fast targeted authenticated smoke on a local synthetic app. This does
    # not replace the manually dispatched site-wide browser-a11y matrix.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate member browser script and existing fixture runner
        run: |
          node --check scripts/qa-isolated/member_navigation_browser_smoke.cjs
          bash -n scripts/qa-isolated/run_config_browser_smoke.sh
      - name: Member title, button, history and responsive WCAG smoke
        timeout-minutes: 12
        run: QA_MEMBER_NAV_ONLY=1 bash scripts/qa-isolated/run_config_browser_smoke.sh
      - name: Upload isolated evidence and synthetic screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linkfree-qa-member-navigation-synthetic
          path: |
            /tmp/linkfree-audit/member-navigation-results.json
            /tmp/linkfree-audit/member-navigation-screenshots/
          if-no-files-found: warn
          retention-days: 30

  public-catalog-browser:
    # Fast public only: 320–1280px, axe scoped to main, user-flow and no secrets.
    # Does not replace the manually dispatched site-wide accessibility matrix.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate public browser test and existing fixture runner
        run: |
          node --check scripts/qa-isolated/public_catalog_browser_smoke.cjs
          bash -n scripts/qa-isolated/run_config_browser_smoke.sh
      - name: Validate homepage, member catalog and future-only roadmap
        timeout-minutes: 12
        run: QA_PUBLIC_CATALOG_ONLY=1 bash scripts/qa-isolated/run_config_browser_smoke.sh
      - name: Upload public acceptance and viewport screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linkfree-qa-public-catalog-synthetic
          path: |
            /tmp/linkfree-audit/public-catalog-results.json
            /tmp/linkfree-audit/public-catalog-screenshots/
          if-no-files-found: warn
          retention-days: 30

  browser-a11y:
    # Extended browser audit is manual only: repeated stalls blocked PR #33.
    # Skipped on automatic CI is NOT an accessibility or browser acceptance pass.
    # Run manually after HTTP and both installer jobs succeed; retain all evidence.
    if: github.event_name == 'workflow_dispatch'
    needs: [http-behavior, installer-isolated]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install PHP SQLite driver if absent
        run: |
          if ! php -m | grep -qi '^pdo_sqlite$'; then
            sudo apt-get update -qq
            sudo apt-get install -y php-sqlite3
          fi
      - name: Prepare ephemeral app with synthetic accounts
        shell: bash
        run: |
          set -euo pipefail
          QA_APP_ROOT=/tmp/linkfree-audit/linkstack
          install -d "$QA_APP_ROOT"
          rsync -a --exclude='.env' --exclude='*.sqlite' --exclude='*.sqlite3' --exclude='*.db' --exclude=INSTALLING --exclude=INSTALLERLOCK linkstack/ "$QA_APP_ROOT/"
          install -d "$QA_APP_ROOT"/database "$QA_APP_ROOT"/storage/framework/{cache,sessions,views} "$QA_APP_ROOT"/storage/logs "$QA_APP_ROOT"/assets/favicon/icons
          touch "$QA_APP_ROOT/database/audit.sqlite"
          KEY=$(php -r 'echo "base64:".base64_encode(random_bytes(32));')
          cat > "$QA_APP_ROOT/.env" <<EOF
          APP_NAME=LinkFreeQA
          APP_ENV=local
          APP_DEBUG=false
          APP_KEY=$KEY
          APP_URL=http://127.0.0.1:18765
          DB_CONNECTION=sqlite
          DB_DATABASE=/tmp/linkfree-audit/linkstack/database/audit.sqlite
          DB_FOREIGN_KEYS=true
          SESSION_DRIVER=file
          CACHE_DRIVER=array
          QUEUE_CONNECTION=sync
          LOG_CHANNEL=stderr
          MAIL_MAILER=log
          MAIL_FROM_ADDRESS=qa@example.test
          ALLOW_REGISTRATION=true
          REGISTER_AUTH=auth
          FORCE_ROUTE_HTTPS=false
          EOF
          cd "$QA_APP_ROOT"
          php artisan migrate --force --no-interaction > /tmp/linkfree-audit/migrations.log
          QA_APP_ROOT="$QA_APP_ROOT" php "$GITHUB_WORKSPACE/scripts/qa-isolated/seed.php"
      - name: Install isolated browser tooling
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/linkfree-qa-node
          cd /tmp/linkfree-qa-node
          npm init -y > /dev/null
          npm install --no-audit --no-fund playwright @axe-core/playwright
          ./node_modules/.bin/playwright install --with-deps chromium firefox webkit > /tmp/linkfree-audit/browser-install.log 2>&1
      - name: Start localhost-only app for browser audit
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/linkfree-audit/linkstack
          # Use the same PHP server/router as Laravel ServeCommand, without its .env restart watcher.
          # Direct PHP also avoids inheriting Laravel's bootstrapped dotenv values via --no-reload.
          php -S 127.0.0.1:18765 server.php > /tmp/linkfree-audit/server.log 2>&1 &
          echo $! > /tmp/linkfree-audit/server.pid
          for i in $(seq 1 45); do
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' --max-time 2 http://127.0.0.1:18765/login || true)
            if [ "$STATUS" = 200 ]; then
              echo "Local synthetic app ready for browser"
              exit 0
            fi
            sleep 1
          done
          tail -n 30 /tmp/linkfree-audit/server.log
          exit 1
      - name: Scan anonymous, member and admin pages with axe-core Chromium
        timeout-minutes: 15
        env:
          QA_EXPECTED_SITE: http://127.0.0.1:18765
        run: node scripts/qa-isolated/browser_a11y.cjs
      - name: Verify isolated server remained alive
        if: always()
        run: |
          test -s /tmp/linkfree-audit/server.pid
          kill -0 "$(cat /tmp/linkfree-audit/server.pid)"
          curl --fail --silent --show-error --max-time 10 http://127.0.0.1:18765/login >/dev/null
      - name: Upload complete a11y evidence, including residual contrast findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linkfree-qa-browser-a11y-synthetic
          path: /tmp/linkfree-audit/browser-a11y-results.json
          if-no-files-found: warn
          retention-days: 30

  installer-isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        engine: [sqlite, mysql]
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: qa-root-only
          MARIADB_DATABASE: lf_install
          MARIADB_USER: lf_fixture
          MARIADB_PASSWORD: qa-fixture-only
        ports:
          - 33306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Ensure PHP drivers and installer extensions
        run: |
          set -euo pipefail
          version=$(php -r 'echo PHP_MAJOR_VERSION.".".PHP_MINOR_VERSION;')
          missing=()
          for ext in pdo_sqlite pdo_mysql bcmath curl dom mbstring; do
            if ! php -m | grep -qi "^$ext$"; then
              case "$ext" in
                pdo_sqlite) missing+=("php$version-sqlite3");;
                pdo_mysql) missing+=("php$version-mysql");;
                dom) missing+=("php$version-xml");;
                *) missing+=("php$version-$ext");;
              esac
            fi
          done
          if (( ${#missing[@]} )); then
            sudo apt-get update -qq
            sudo apt-get install -y "${missing[@]}"
          fi
      - name: Prepare virgin installer fixture (no production data)
        run: |
          set -euo pipefail
          root=/tmp/linkfree-install/linkstack
          install -d "$root"
          rsync -a --exclude='.env' --exclude='*.sqlite' --exclude='*.sqlite3' --exclude='*.db' --exclude=INSTALLERLOCK --exclude=INSTALLING linkstack/ "$root/"
          install -d "$root"/database "$root"/storage/framework/{cache,sessions,views} "$root"/storage/app "$root"/storage/logs
          touch "$root/database/audit.sqlite" "$root/INSTALLING"
          key=$(php -r 'echo "base64:".base64_encode(random_bytes(32));')
          cat > "$root/.env" <<EOF
          APP_NAME=LinkFreeQA
          APP_ENV=local
          APP_DEBUG=false
          APP_KEY=$key
          APP_URL=http://127.0.0.1:18766
          DB_CONNECTION=sqlite
          DB_DATABASE=$root/database/audit.sqlite
          DB_FOREIGN_KEYS=true
          SESSION_DRIVER=file
          CACHE_DRIVER=array
          QUEUE_CONNECTION=sync
          LOG_CHANNEL=stderr
          MAIL_MAILER=log
          MAIL_FROM_ADDRESS=qa@example.test
          ALLOW_REGISTRATION=true
          REGISTER_AUTH=auth
          FORCE_ROUTE_HTTPS=false
          LOCALE=en
          HOME_URL=
          EOF
          cd "$root"
          # Do not use artisan serve: its .env watcher restarts the server during setup.
          # Invoke the repository router directly so each request loads the new .env.
          php -S 127.0.0.1:18766 server.php > /tmp/linkfree-install/server.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -s -o /dev/null -w '%{http_code}' --max-time 2 http://127.0.0.1:18766/?3 | grep -q '^200$'; then exit 0; fi
            sleep 1
          done
          echo "Disposable installer did not start"; exit 1
      - name: Verify installer lifecycle and authorization
        env:
          QA_INSTALL_ENGINE: ${{ matrix.engine }}
          QA_INSTALL_ORIGIN: http://127.0.0.1:18766
        run: python3 scripts/qa-isolated/installer_acceptance.py
      - name: Upload sanitized installer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linkfree-installer-${{ matrix.engine }}
          path: /tmp/linkfree-install/installer-results.json
          if-no-files-found: warn
          retention-days: 30
