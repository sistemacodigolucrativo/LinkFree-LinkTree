name: QA report evidence and matrix consistency
on:
  push:
    branches: [auditoria/homologacao-20261124]
    paths:
      - 'docs/homologacao-automatizada/**'
      - 'scripts/verify-linkfree-qa-report.py'
      - '.github/workflows/qa-report-consistency.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/homologacao-automatizada/**'
      - 'scripts/verify-linkfree-qa-report.py'
      - '.github/workflows/qa-report-consistency.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation-consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate exact 43-case matrix and evidence links
        run: python3 scripts/verify-linkfree-qa-report.py
