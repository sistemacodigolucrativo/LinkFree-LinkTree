name: Studio links and theme preview regression
on:
  push:
    paths:
      - 'linkstack/resources/views/studio/links.blade.php'
      - 'linkstack/resources/views/studio/theme.blade.php'
      - 'scripts/audit-studio-layout.py'
      - '.github/workflows/studio-layout-regression.yml'
  pull_request:
    paths:
      - 'linkstack/resources/views/studio/links.blade.php'
      - 'linkstack/resources/views/studio/theme.blade.php'
      - 'scripts/audit-studio-layout.py'
      - '.github/workflows/studio-layout-regression.yml'

permissions:
  contents: read

jobs:
  studio-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify links cards, fullscreen preview and theme preview UI
        run: python scripts/audit-studio-layout.py
