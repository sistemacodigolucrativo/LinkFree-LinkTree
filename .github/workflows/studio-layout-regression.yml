permissions:
  contents: read

jobs:
  studio-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify links cards, fullscreen preview and theme preview UI
        run: python scripts/audit-studio-layout.py
      - name: Audit default LinkFree wordmark and favicon
        run: python scripts/audit-default-branding.py
      - name: Audit light and dark WCAG contrast ratios
        run: python scripts/audit-color-contrast.py
      - name: Install browser test dependencies
        run: python -m pip install --quiet playwright
      - name: Verify eight inline block previews in the browser
        run: python scripts/audit-block-previews.py
      - name: Test mobile widths in headless Chrome
        run: python scripts/audit-responsive-mobile.py
      - name: Verify member topbar, localized labels and viewport reflow
        run: |
          for file in linkstack/resources/lang/*/member_ui.php; do php -l "$file"; done
          python scripts/audit-member-navigation.py
      - name: Test sidebar closing, inline link buttons and notification viewport
        run: python scripts/audit-linkfree-interactions.py
      - name: Test profile avatar, CKEditor contrast and light gradient
        run: python scripts/audit-profile-editor-gradient.py
      - name: Audit premium login layout and preserved authentication
        run: python scripts/audit-login-layout.py
      - name: Compile Blade templates and lint generated PHP
        run: php scripts/audit-blade-compile.php
      - name: Verify sectional public site editor
        run: |
          python scripts/audit-public-site-editor.py
          php -l linkstack/app/Services/PublicSiteContent.php
          php -l linkstack/app/Http/Controllers/AdminController.php
          php -l linkstack/routes/web.php
      - name: Compile authentication views with bootstrapped Laravel
        run: php scripts/audit-auth-blade-boot.php
      - name: Audit ten new scoped enhancements
        run: |
          python scripts/audit-new-improvements.py
          php scripts/audit-new-improvements.php
          for path in linkstack/app/Services/ThemeOptions.php linkstack/app/Services/UserLinkLimit.php linkstack/app/Services/WhatsAppLink.php linkstack/app/Services/VisitAttribution.php linkstack/app/Services/ConsentReceipt.php linkstack/app/Models/Link.php linkstack/app/Http/Controllers/Auth/SocialLoginController.php linkstack/app/Http/Controllers/Auth/RegisteredUserController.php linkstack/database/migrations/2026_11_23_000001_create_registration_consents_table.php; do php -l "$path"; done
      - name: Audit persistent VIP toggle and account creation
        run: |
          python scripts/audit-registration-vip.py
          php -l linkstack/app/Services/RegistrationVip.php
          php -l linkstack/app/Http/Controllers/AdminController.php
          php -l linkstack/app/Http/Controllers/Auth/RegisteredUserController.php
          php -l linkstack/app/Http/Controllers/Auth/SocialLoginController.php
          php -l linkstack/routes/web.php
      - name: Test public profile top spacing and share overlay priority
        run: python scripts/audit-public-share-overlay.py
