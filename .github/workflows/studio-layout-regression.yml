name: Studio, dashboard and mobile layout regression
on:
  push:
    paths:
      - 'linkstack/resources/views/studio/links.blade.php'
      - 'linkstack/resources/views/studio/theme.blade.php'
      - 'linkstack/resources/views/panel/index.blade.php'
      - 'linkstack/resources/views/layouts/sidebar.blade.php'
      - 'linkstack/resources/views/layouts/guest.blade.php'
      - 'linkstack/assets/css/linkfree-color-modes.css'
      - 'linkstack/assets/js/main-dashboard.js'
      - 'linkstack/assets/js/sidebar-auto-close.js'
      - 'linkstack/assets/css/linkfree-navigation-polish.css'
      - 'scripts/audit-studio-layout.py'
      - 'scripts/audit-responsive-mobile.py'
      - 'scripts/audit-linkfree-interactions.py'
      - 'scripts/audit-color-contrast.py'
      - '.github/workflows/studio-layout-regression.yml'
  pull_request:
    paths:
      - 'linkstack/resources/views/studio/links.blade.php'
      - 'linkstack/resources/views/studio/theme.blade.php'
      - 'linkstack/resources/views/panel/index.blade.php'
      - 'linkstack/resources/views/layouts/sidebar.blade.php'
      - 'linkstack/resources/views/layouts/guest.blade.php'
      - 'linkstack/assets/css/linkfree-color-modes.css'
      - 'linkstack/assets/js/main-dashboard.js'
      - 'linkstack/assets/js/sidebar-auto-close.js'
      - 'linkstack/assets/css/linkfree-navigation-polish.css'
      - 'scripts/audit-studio-layout.py'
      - 'scripts/audit-responsive-mobile.py'
      - 'scripts/audit-linkfree-interactions.py'
      - 'scripts/audit-color-contrast.py'
      - '.github/workflows/studio-layout-regression.yml'

permissions:
  contents: read

jobs:
  studio-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify links cards, fullscreen preview and theme preview UI
        run: python scripts/audit-studio-layout.py
      - name: Audit light and dark WCAG contrast ratios
        run: python scripts/audit-color-contrast.py
      - name: Install browser test dependencies
        run: python -m pip install --quiet playwright
      - name: Test mobile widths in headless Chrome
        run: python scripts/audit-responsive-mobile.py
      - name: Test sidebar closing, inline link buttons and notification viewport
        run: python scripts/audit-linkfree-interactions.py
